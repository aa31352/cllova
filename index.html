<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart Trash Bin</title>
  <style>
    :root {
      --green: #16a34a;
      --yellow: #f59e0b;
      --red: #dc2626;
      --bg: #0b1020;
      --panel: #11172a;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --border: #1f2937;
      --accent: #60a5fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #13203f 0%, #0b1020 45%, #0b1020 100%);
      color: var(--text);
    }
    header {
      padding: 24px 16px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: rgba(11,16,32,0.85); backdrop-filter: blur(6px);
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 16px; }
    h1 { margin: 0; font-size: 20px; letter-spacing: 0.4px; }

    .grid {
      display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.0));
      border: 1px solid var(--border); border-radius: 12px;
      padding: 16px; display: flex; flex-direction: column; gap: 8px;
    }
    .card .title { font-weight: 600; font-size: 16px; }
    .meta { color: var(--muted); font-size: 13px; }
    .badge { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot.green { background: var(--green); }
    .dot.yellow { background: var(--yellow); }
    .dot.red { background: var(--red); }

    .panel {
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.0));
      border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-top: 24px;
    }
    .panel h2 { margin: 0 0 12px 0; font-size: 16px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input[type="text"], select, textarea {
      width: 100%; background: #0f162b; color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 12px; font-size: 14px;
    }
    textarea { min-height: 90px; resize: vertical; }
    button {
      appearance: none; border: 0; border-radius: 10px; padding: 10px 14px;
      background: linear-gradient(135deg, #2563eb, #7c3aed); color: white; font-weight: 600;
      cursor: pointer; transition: transform 0.05s ease, filter 0.2s;
    }
    button:active { transform: translateY(1px); }

    .row { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
    @media (max-width: 700px) { .row { grid-template-columns: 1fr; } }

    .status { margin-top: 8px; font-size: 13px; }
    .status.error { color: #fca5a5; }
    .status.ok { color: #86efac; }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>Smart Trash Bin</h1>
    </div>
  </header>

  <main class="container">
    <section>
      <div class="panel">
        <h2>Bin Status</h2>
        <div id="bins" class="grid" aria-live="polite"></div>
      </div>
    </section>

    <section>
      <div class="panel">
        <h2>Submit a Report</h2>
        <form id="reportForm">
          <div class="row">
            <div>
              <label for="binId">Select Bin</label>
              <select id="binId" required></select>
            </div>
            <div>
              <label for="issue">Issue Description</label>
              <input id="issue" type="text" placeholder="Describe the issue..." required />
            </div>
          </div>
          <div style="margin-top:12px; display:flex; gap:12px; align-items:center;">
            <button type="submit">Submit Report</button>
            <span id="reportStatus" class="status" role="status"></span>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script>
    const binsEl = document.getElementById('bins');
    const binSelect = document.getElementById('binId');
    const form = document.getElementById('reportForm');
    const reportStatusEl = document.getElementById('reportStatus');

    async function fetchBins() {
      const res = await fetch('api.php?action=bins');
      if (!res.ok) throw new Error('Failed to fetch bins');
      const data = await res.json();
      return Array.isArray(data.bins) ? data.bins : [];
    }

    function renderBins(bins) {
      binsEl.innerHTML = '';
      binSelect.innerHTML = '';

      for (const bin of bins) {
        const card = document.createElement('div');
        card.className = 'card';
        const dot = `<span class="dot ${bin.status_color}"></span>`;
        card.innerHTML = `
          <div class="title">Bin #${bin.id}</div>
          <div class="meta">${bin.location ?? ''}</div>
          <div class="badge">${dot}<span>${bin.status_color.toUpperCase()} — ${bin.fill_percentage}% full</span></div>
        `;
        binsEl.appendChild(card);

        const opt = document.createElement('option');
        opt.value = String(bin.id);
        opt.textContent = `#${bin.id} — ${bin.location ?? 'Unknown'} (${bin.fill_percentage}% ${bin.status_color})`;
        binSelect.appendChild(opt);
      }

      if (bins.length === 0) {
        binsEl.innerHTML = '<div class="meta">No bins found.</div>';
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = 'No bins available';
        binSelect.appendChild(opt);
      }
    }

    async function submitReport(binId, issueDescription) {
      const res = await fetch('api.php?action=report', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bin_id: Number(binId), issue_description: issueDescription })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const message = data && data.error ? data.error : 'Failed to submit report';
        throw new Error(message);
      }
      return data;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      reportStatusEl.textContent = '';
      reportStatusEl.className = 'status';

      const binId = binSelect.value;
      const issue = document.getElementById('issue').value.trim();

      if (!binId || !issue) {
        reportStatusEl.textContent = 'Please select a bin and enter an issue description.';
        reportStatusEl.classList.add('error');
        return;
      }

      try {
        const result = await submitReport(binId, issue);
        reportStatusEl.textContent = 'Report submitted successfully.';
        reportStatusEl.classList.add('ok');
        form.reset();
      } catch (err) {
        reportStatusEl.textContent = err.message || 'Failed to submit report.';
        reportStatusEl.classList.add('error');
      }
    });

    (async function init() {
      try {
        const bins = await fetchBins();
        renderBins(bins);
      } catch (err) {
        binsEl.innerHTML = `<div class="meta">${err.message || 'Failed to load bins.'}</div>`;
      }
    })();
  </script>
</body>
</html>
